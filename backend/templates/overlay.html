<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarTip Live Alert Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 40px;
    }

    .alert-container {
      position: relative;
      opacity: 0;
      transform: translateY(-50px) scale(0.9);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .alert-container.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .alert-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 27, 75, 0.98));
      backdrop-filter: blur(16px);
      border: 2px solid rgba(99, 102, 241, 0.6);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.4);
      padding: 24px 32px;
      min-width: 420px;
      max-width: 580px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    .alert-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 60%);
      animation: rotateGlow 8s linear infinite;
    }

    @keyframes rotateGlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .badge-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.5);
      flex-shrink: 0;
      z-index: 1;
      animation: pulseIcon 2s infinite ease-in-out;
    }

    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .content-wrap {
      flex: 1;
      z-index: 1;
    }

    .alert-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .supporter-name {
      color: #F8FAFC;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .action-text {
      color: #94A3B8;
      font-size: 15px;
      font-weight: 600;
    }

    .amount-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34D399;
      font-weight: 800;
      font-size: 20px;
      padding: 4px 12px;
      border-radius: 12px;
      margin-top: 4px;
    }

    .supporter-message {
      color: #E2E8F0;
      font-size: 15px;
      line-height: 1.4;
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 10px;
      border-left: 3px solid #6366F1;
      font-style: italic;
      word-break: break-word;
    }

    .stellar-tag {
      position: absolute;
      bottom: 8px;
      right: 14px;
      font-size: 10px;
      font-weight: 700;
      color: #64748B;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="alertBox" class="alert-container">
    <div class="alert-card">
      <div class="badge-icon" id="alertIcon">⭐</div>
      <div class="content-wrap">
        <div class="alert-header">
          <span class="supporter-name" id="supporterName">Alice</span>
          <span class="action-text">just tipped!</span>
        </div>
        <div class="amount-badge" id="amountBadge">
          <span id="tipAmount">10</span>
          <span id="tipAsset">XLM</span>
        </div>
        <div class="supporter-message" id="supporterMessage">
          Keep up the fantastic work!
        </div>
      </div>
      <span class="stellar-tag" id="stellarTag">Stellar Verified</span>
    </div>
  </div>

  <script>
    const overlayToken = "{{ overlay_token }}";
    const alertBox = document.getElementById('alertBox');
    const supporterNameEl = document.getElementById('supporterName');
    const tipAmountEl = document.getElementById('tipAmount');
    const tipAssetEl = document.getElementById('tipAsset');
    const supporterMessageEl = document.getElementById('supporterMessage');
    const stellarTagEl = document.getElementById('stellarTag');
    const alertIconEl = document.getElementById('alertIcon');

    // Audio chime using Web Audio API
    function playChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;

        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(523.25, now); // C5
        osc1.frequency.exponentialRampToValueAtTime(659.25, now + 0.15); // E5

        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(783.99, now + 0.1); // G5
        osc2.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3); // C6

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now + 0.1);
        osc1.stop(now + 1.2);
        osc2.stop(now + 1.2);
      } catch (e) {
        console.warn('Audio chime error:', e);
      }
    }

    let hideTimeout = null;

    function showAlert(data) {
      supporterNameEl.textContent = data.supporter_name || 'Anonymous';
      tipAmountEl.textContent = data.amount;
      tipAssetEl.textContent = data.asset_code;

      if (data.asset_code === 'USDC') {
        alertIconEl.textContent = '💵';
      } else {
        alertIconEl.textContent = '🚀';
      }

      if (data.message && data.message.trim().length > 0) {
        supporterMessageEl.textContent = `"${data.message}"`;
        supporterMessageEl.style.display = 'block';
      } else {
        supporterMessageEl.style.display = 'none';
      }

      if (data.is_test) {
        stellarTagEl.textContent = 'Test Alert Preview';
      } else {
        stellarTagEl.textContent = 'Stellar Testnet Confirmed';
      }

      if (data.sound_enabled !== false) {
        playChime();
      }

      alertBox.classList.add('active');

      if (hideTimeout) clearTimeout(hideTimeout);
      const duration = (data.duration_seconds || 6) * 1000;
      hideTimeout = setTimeout(() => {
        alertBox.classList.remove('active');
      }, duration);
    }

    // Connect Server-Sent Events stream
    function connectSSE() {
      const streamUrl = `/api/alerts/stream/${overlayToken}/`;
      const eventSource = new EventSource(streamUrl);

      eventSource.addEventListener('tip', (e) => {
        try {
          const data = JSON.parse(e.data);
          showAlert(data);
        } catch (err) {
          console.error('Failed to parse tip event:', err);
        }
      });

      eventSource.onerror = (err) => {
        console.warn('SSE connection interrupted, reconnecting in 5s...', err);
        eventSource.close();
        setTimeout(connectSSE, 5000);
      };
    }

    connectSSE();
  </script>
</body>
</html>
